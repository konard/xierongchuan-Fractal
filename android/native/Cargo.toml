# The Android library of Fractal.
#
# It is a separate crate, and not a default member of the workspace, so that
# `cargo check`, `cargo build` and `cargo test` at the root of the repository
# never build a `cdylib`. Being a workspace member keeps its dependency
# versions identical to the ones of the desktop build.
[package]
name = "fractal-android"
version = "14.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The features of Fractal that depend on a C library without an Android port
# are disabled. See the `[features]` section of the manifest of Fractal.
fractal = { path = "../..", default-features = false }
