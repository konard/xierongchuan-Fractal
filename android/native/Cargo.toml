# The Android library of Fractal.
#
# It is intentionally a separate crate, outside of the workspace of the desktop
# build: `cargo check`, `cargo build` and `cargo test` at the root of the
# repository never look at it, and never build a `cdylib`.
[package]
name = "fractal-android"
version = "14.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
fractal = { path = "../.." }
