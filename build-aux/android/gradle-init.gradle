// Point the Android Gradle Plugin at the NDK this image pins.
//
// AGP strips the native libraries it packages, but only if it can find an NDK,
// and it looks for the exact version it defaults to rather than for the one
// that is installed. When it cannot, it says so and packages the libraries
// unstripped:
//
//     > Task :app:stripDebugDebugSymbols
//     Unable to strip the following libraries, packaging them as they are: ...
//
// For this application that is most of the package: the symbol tables of the
// GTK stack and of the Rust library together weigh more than the code.
//
// The Gradle project is generated by Pixiewood, so the setting cannot live in
// `build.gradle`. `build-aux/android/podman.sh` copies this file into the
// `init.d` of the container's GRADLE_USER_HOME, where Gradle applies it to
// every build it runs there.
// The version is what AGP wants, not the path: given a path whose version is
// not the one it defaults to, it reports the mismatch and gives up.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        def ndk = System.getenv('ANDROID_NDK_HOME')
        if (ndk && new File(ndk).directory) {
            project.extensions.getByName('android').ndkVersion =
                new File(ndk).name
        } else {
            project.logger.warn(
                'ANDROID_NDK_HOME is not a directory, so the native libraries ' +
                    'will be packaged unstripped.')
        }
    }
}
