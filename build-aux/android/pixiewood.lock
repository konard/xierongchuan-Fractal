# Pinned revisions of the Android toolchain and of the GTK runtime stack that
# Pixiewood resolves for it.
#
# The toolchain entries are the ARG values of build-aux/android/Containerfile
# and are authoritative: change them there and mirror them here.
#
# The runtime entries are the revisions that Pixiewood's wrap files resolved to
# when the toolchain smoke test (experiments/android-gtk-smoke) was last built.
# They are recorded so a build can be reproduced and so unexpected drift in the
# GTK stack is visible in review. Regenerate them after a successful build with:
#
#   (cd experiments/android-gtk-smoke/subprojects \
#     && for d in */; do [ -d "$d/.git" ] \
#        && printf '%s %s\n' "${d%/}" "$(git -C "$d" rev-parse HEAD)"; done)
#
# Recorded on 2026-07-25.

